# Entrega do SPA + proxy da API no mesmo domínio.
#
# Juntar os dois numa origem só é o que dispensa CORS: o navegador vê tudo como
# o mesmo site, e a API não precisa saber quem a chama.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compressão: o bundle e o CSS são texto e encolhem bastante.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # O app usa BrowserRouter (URLs sem "#"), então /radar e /times/<id> não
    # existem no disco. Sem esta regra, abrir a URL direto ou dar F5 devolveria
    # 404 do servidor, mesmo com a navegação por dentro do app funcionando.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index aponta para os assets com hash no nome. Se ele ficar em cache, o
    # navegador continua pedindo a versão antiga depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Os assets têm hash no nome: mudou o conteúdo, mudou a URL. Podem ficar em
    # cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # O DNS interno do Docker (127.0.0.11) é consultado a cada 30s. Sem o
        # resolver, o nginx resolveria "api" uma única vez na subida e
        # continuaria falando com o IP antigo depois de a API ser recriada.
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8080;

        # $request_uri preserva o caminho e a query. Com proxy_pass por variável
        # o nginx NÃO repassa a URI sozinho — sem isso, toda chamada chegaria
        # na raiz da API.
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A API responde rápido; um timeout curto evita conexão pendurada.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Cabeçalhos de segurança básicos. CSP fica de fora de propósito: exigiria
    # inventariar o que o app carrega (Google Fonts, Material Symbols) e uma
    # política errada quebra a tela silenciosamente.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

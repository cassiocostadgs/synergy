<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Símbolo do Synergy: moldura hexagonal com três nós ligados em triângulo.
    Vai sobre uma placa escura arredondada para se manter legível em abas claras.
  -->
  <defs>
    <linearGradient id="synergy-stroke" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d78" />
      <stop offset="1" stop-color="#00fbfb" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0d1515" />

  <polygon
    points="16,5.5 25.09,10.75 25.09,21.25 16,26.5 6.91,21.25 6.91,10.75"
    fill="none"
    stroke="url(#synergy-stroke)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <path
    d="M16 10.6 L20.68 18.7 L11.32 18.7 Z"
    fill="none"
    stroke="url(#synergy-stroke)"
    stroke-width="1.1"
    stroke-linejoin="round"
    opacity="0.5"
  />

  <circle cx="16" cy="10.6" r="2.1" fill="#ff2d78" />
  <circle cx="20.68" cy="18.7" r="2.1" fill="#00fbfb" />
  <circle cx="11.32" cy="18.7" r="2.1" fill="#00fbfb" />
</svg>

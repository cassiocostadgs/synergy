<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Símbolo do Synergy: moldura hexagonal com duas circunferências que se
    sobrepõem e a interseção preenchida. Vai sobre uma placa escura arredondada
    para se manter legível em abas de tema claro.
  -->
  <defs>
    <linearGradient id="synergy-stroke" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d78" />
      <stop offset="1" stop-color="#00fbfb" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0d1515" />

  <polygon
    points="16,5.5 25.09,10.75 25.09,21.25 16,26.5 6.91,21.25 6.91,10.75"
    fill="none"
    stroke="url(#synergy-stroke)"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <circle cx="13.8" cy="16" r="4.1" fill="none" stroke="#ff2d78" stroke-width="1.3" />
  <circle cx="18.2" cy="16" r="4.1" fill="none" stroke="#00fbfb" stroke-width="1.3" />

  <path
    d="M16,12.54 A4.1,4.1 0 0 1 16,19.46 A4.1,4.1 0 0 1 16,12.54 Z"
    fill="url(#synergy-stroke)"
  />
</svg>
